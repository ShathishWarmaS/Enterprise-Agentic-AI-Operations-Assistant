name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Tesseract (for the OCR fallback test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Create venv and install
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev,ocr]"

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Black (format check)
        run: uv run black --check .

      - name: Mypy (types)
        run: uv run mypy app

      - name: Import check
        run: uv run python -c "import app.main; import app.services.evaluation"

      - name: Pytest
        run: uv run pytest -q --cov=app --cov-report=term-missing

      - name: Seed + evaluation gate
        run: |
          uv run python scripts/seed.py
          uv run python scripts/run_eval.py --min-pass 0.7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t enterprise-agentic-ai:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 enterprise-agentic-ai:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break || sleep 2
          done
          curl -sf http://localhost:8000/health
          docker rm -f api
