services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      LLM_MODE: ${LLM_MODE:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DATABASE_URL: postgresql+psycopg2://ops:ops@postgres:5432/ops
      REDIS_URL: redis://redis:6379/0
      VECTOR_STORE_DIR: /app/storage/vector
      UPLOAD_DIR: /app/storage/uploads
      VECTOR_BACKEND: ${VECTOR_BACKEND:-local}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-hash}
    volumes:
      - storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      seed:
        condition: service_completed_successfully

  seed:
    build: .
    command: python scripts/seed.py
    environment:
      DATABASE_URL: postgresql+psycopg2://ops:ops@postgres:5432/ops
      REDIS_URL: redis://redis:6379/0
      VECTOR_STORE_DIR: /app/storage/vector
      UPLOAD_DIR: /app/storage/uploads
      VECTOR_BACKEND: ${VECTOR_BACKEND:-local}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-hash}
    volumes:
      - storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  frontend:
    build: .
    command: streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
      POSTGRES_DB: ops
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine

volumes:
  storage:
  pgdata:
